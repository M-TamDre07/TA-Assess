<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">TA Assess abstract documentation background</title>
  <desc id="desc">Abstract blue waves and connected points representing data flow and structured assessment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#12243b"/>
      <stop offset="0.55" stop-color="#214a84"/>
      <stop offset="1" stop-color="#287e9f"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" x2="1">
      <stop offset="0" stop-color="#72d5ff" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#72d5ff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#b6f1ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <path d="M-100 500 C260 260 430 650 760 410 S1260 170 1710 390" fill="none" stroke="url(#wave)" stroke-width="90" opacity=".32" filter="url(#blur)"/>
  <path d="M-80 520 C260 300 430 650 760 420 S1260 190 1700 390" fill="none" stroke="url(#wave)" stroke-width="5"/>
  <path d="M-80 570 C260 350 430 700 760 470 S1260 240 1700 440" fill="none" stroke="#b6f1ff" stroke-opacity=".24" stroke-width="2"/>
  <g fill="#b6f1ff" opacity=".8">
    <circle cx="250" cy="395" r="6"/><circle cx="455" cy="500" r="5"/><circle cx="735" cy="430" r="7"/><circle cx="980" cy="300" r="5"/><circle cx="1220" cy="330" r="7"/><circle cx="1435" cy="385" r="5"/>
  </g>
  <g stroke="#b6f1ff" stroke-opacity=".22" fill="none">
    <path d="M250 395 L455 500 L735 430 L980 300 L1220 330 L1435 385"/>
    <path d="M455 500 L620 270 L980 300"/>
    <path d="M980 300 L1080 520 L1435 385"/>
  </g>
</svg>
