name: TA Assess CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate structure, links, and logic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run assessment tests
        run: node tests/run-tests.js

      - name: Check repository integrity
        run: node tests/check-repository.js

      - name: Syntax check frontend JavaScript
        run: |
          node --check js/assessments-data.js
          node --check js/account.js
          node --check js/account-dashboard.js
          node --check js/account-insights.js
          node --check js/access-control.js
          node --check js/insight-engine.js
          node --check js/recommendation-engine.js
          node --check js/result-engine.js
          node --check js/runtime-config.js
          node --check js/script.js
          node --check js/security-hardening.js
          node --check js/test-access-patch.js
          node --check js/test-engine.js
          node --check js/client-diagnostics.js
          node --check js/admin-dashboard.js

      - name: Syntax check Vercel Functions
        run: |
          node --check api/question-bank.js
          node --check api/assessment-session.js
          node --check api/assessment-submit.js
          node --check api/assessment-event.js
          node --check api/system-health.js

      - name: Syntax check Apps Script source
        shell: bash
        run: |
          set -e
          for file in google-apps-script/*.gs; do
            echo "Checking $file"
            node --check < "$file"
          done
