name: TA Assess CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate structure, links, and logic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run assessment tests
        run: node tests/run-tests.js

      - name: Check repository integrity
        run: node tests/check-repository.js

      - name: Syntax check frontend JavaScript
        run: |
          node --check js/assessments-data.js
          node --check js/account.js
          node --check js/insight-engine.js
          node --check js/recommendation-engine.js
          node --check js/result-engine.js
          node --check js/runtime-config.js
          node --check js/script.js
          node --check js/test-engine.js

      - name: Syntax check Apps Script source
        run: |
          node --check google-apps-script/code.gs
          node --check google-apps-script/account.gs
