name: TA Assess CI

on:
  push:
    branches: [main, 'maintenance/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate structure, links, config, and logic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run assessment tests
        run: node tests/run-tests.js

      - name: Check repository integrity
        run: node tests/check-repository.js

      - name: Check Vercel configuration
        run: node tests/check-vercel-config.js

      - name: Syntax check frontend JavaScript
        run: |
          set -e
          for file in js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Syntax check Vercel Functions
        run: |
          set -e
          for file in api/**/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Syntax check Apps Script source
        shell: bash
        run: |
          set -e
          for file in backend/apps-script/*.gs; do
            echo "Checking $file"
            node --check < "$file"
          done

      - name: Syntax check PHP scaffold
        run: php -l backend/php/bootstrap.php
